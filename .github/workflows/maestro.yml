# Maestro (emulator)
#
# PURPOSE: Run the directed Movie Deck test journey on a GitHub-hosted
# Android emulator with Maestro assertions — the Robo replacement after
# two harness-ground Test Lab failures (run #5: action 57 results-card
# sync; run #6: action 24 Trending "Language" pill tap, crawl timeout).
# Unlike Robo, verdicts come from Maestro ASSERTIONS, not video review.
#
# - Manual-only trigger: workflow_dispatch ONLY (no push, pull_request, or
#   schedule triggers). Each run is started by hand from the Actions tab.
# - No Firebase / Test Lab anywhere: no Google steps, no WIF, no service
#   account, no keys. testlab.yml stays in the repo untouched as reference
#   + emergency fallback only, never run per the 2026-10-28 decision.
# - One EAS build consumed per run: every run builds a fresh Android
#   preview APK via EAS before installing it on the emulator. The EAS
#   half below is copied verbatim from testlab.yml (same 4 secrets, same
#   order, same grep -c check, same EXPO_TOKEN).
# - APK download uses --json: build:download writes to a temp cache outside
#   the repo, so the workflow reads the path from download.json and copies
#   it to ./app.apk. The cp step is LOAD-BEARING — do not "simplify" it away.
# - The runner kills the emulator when its `script` exits, but the
#   workspace persists, so artifacts are uploaded by later steps.
# - Maestro flows (maestro/flows/*.yaml) and maestro-run.sh are delivered
#   by later tasks (D2–D6); this workflow alone does not run until then.
#
# - Job cap 90 min; hard cap 40 min (timeout 2400) around the flows.
#   Estimated first-run wall time: EAS ~11 min + boot ~5 min +
#   flows ~15–25 min ≈ 30–40 min total.
name: Maestro (emulator)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verbatim mirror of .github/workflows/eas-build-android.yml: the EAS
      # cloud builder does NOT inherit the runner's env vars, so bake the
      # keys via .env.production (uploaded with the project, read by Expo
      # at build time). .env.production is written transiently here in CI
      # only and never committed.
      - name: Write .env.production
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_TMDB_API_KEY=%s\nEXPO_PUBLIC_GEMINI_API_KEY=%s\n' \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}" \
            "${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" > .env.production
          grep -c EXPO_PUBLIC .env.production

      - name: EAS build (Android preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          node -e "const d=require('./eas-build.json'); const b=Array.isArray(d)?d[0]:d; if(!b||!b.id){console.error('No build id in eas-build.json');process.exit(1);} console.log(b.id); require('fs').appendFileSync(process.env.GITHUB_ENV,'BUILD_ID='+b.id+'\n');"

      - name: Download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build:download --build-id "$BUILD_ID" --json > download.json
          APK_PATH=$(node -e "const d=require('./download.json'); console.log(d.path || '')")
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: no .path in download.json after build:download" >&2
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: downloaded artifact is not an .apk: $APK_PATH" >&2
              exit 1
              ;;
          esac
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: downloaded APK missing or empty: $APK_PATH" >&2
            exit 1
          fi
          cp "$APK_PATH" ./app.apk
          ls -lh ./app.apk
          test -s ./app.apk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 600
          cores: 4
          ram-size: 4096M
          script: |
            set +e
            adb logcat -c
            adb install ./app.apk
            adb logcat -v time > logcat.txt &
            LOGCAT_PID=$!
            timeout 2400 ./maestro-run.sh > maestro-output.txt 2>&1
            MAESTRO_EXIT=$?
            kill $LOGCAT_PID || true
            exit $MAESTRO_EXIT

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: |
            maestro-output.txt
            logcat.txt
            eas-build.json
            download.json
            maestro/flows/*.yaml
            maestro/shared/*.yaml
            maestro-run.sh

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: maestro-report
          if-no-files-found: warn
