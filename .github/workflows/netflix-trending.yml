name: Netflix trending data

on:
  schedule:
    - cron: '7 19 * * 2'  # Tuesdays 19:07 UTC (3:07 PM EDT): after Netflix's Tuesday
      # TSV publish (verified 2026-10-06 the new week's data wasn't live at 16:06 UTC,
      # so 15:00 UTC fired before the data existed). :07 avoids GitHub's top-of-hour
      # scheduler crush, which was delaying runs by hours.
  workflow_dispatch:

# The push step writes new JSONs to the trending-data branch via GITHUB_TOKEN.
# Without this, the token inherits the repo's default (read-only) workflow
# permissions and the push fails with 403 (git exit 128).
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate trending JSONs
        run: python3 scripts/netflix-trending/update.py /tmp/netflix-staging

      - name: Checkout trending-data branch
        run: |
          git checkout -B trending-data origin/trending-data 2>/dev/null || git checkout -B trending-data

      - name: Copy JSONs and commit
        run: |
          rm -rf netflix
          cp -r /tmp/netflix-staging/netflix netflix
          git add netflix
          WEEK=$(python3 -c "import json; print(json.load(open('netflix/us.json'))['week'])")
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Netflix trending data: week $WEEK [skip ci]" || echo "no changes"

      - name: Push to trending-data
        run: git push origin trending-data
