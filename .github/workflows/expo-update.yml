name: Publish Expo update

# Every push to master automatically publishes an EAS Update to the
# "production" channel via the official eas-cli flow. The native builds
# pin runtimeVersion in app.json, so this one publish reaches them.
# Force-close + reopen the app to pick it up.
#
# NOTE (2026-10-12): the previous custom tools/eas-update/publish_update.py
# flow was retired — its asset URLs 403'd ("Unauthorized asset request"),
# so updates were listed but never downloadable. Official `eas update`
# is the supported path; do not revert to the script.
on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TMDB API key
        run: |
          KEY="${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}"
          if [ -z "$KEY" ]; then echo "EXPO_PUBLIC_TMDB_API_KEY secret is missing or empty"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://api.themoviedb.org/3/configuration?api_key=${KEY}")
          if [ "$CODE" != "200" ]; then echo "TMDB key validation failed (HTTP $CODE) — publish stopped"; exit 1; fi
          echo "TMDB key OK"

      - name: Publish update (official eas update)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: npx eas-cli update --channel production --message "OTA ${{ github.sha }}" --non-interactive
