name: EAS iOS Build

# Manual native rebuild with API keys baked in.
# Trigger: push a commit whose message contains [build-ios].
# (workflow_dispatch also available in the GitHub UI.)
#
# Why this exists (2026-10-12): EAS builds run without repo secrets, so
# EXPO_PUBLIC_* keys were empty in the native binary (no posters, no cloud
# session). This builds with the secrets as env vars, baking them in.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    # Only run on manual dispatch, or on push when the message asks for it.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-ios]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The cloud builder does NOT inherit the runner's env vars, so bake the
      # keys via .env.production (uploaded with the project, read by Expo at
      # build time). .env.production is NOT gitignored by accident — it must
      # be uploaded; it is written transiently here and never committed.
      - name: Write .env.production
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_TMDB_API_KEY=%s\nEXPO_PUBLIC_GEMINI_API_KEY=%s\n' \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}" \
            "${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" > .env.production
          grep -c EXPO_PUBLIC .env.production

      - name: EAS build (iOS preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile preview --non-interactive
